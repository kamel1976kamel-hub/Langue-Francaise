<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Final Pipeline NLP</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        textarea { width: 100%; height: 80px; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🧪 Test Final Pipeline NLP</h1>
    
    <div class="test">
        <h3>Test IA Groq avec modèle valide</h3>
        <textarea id="test-text">Je pense que je suis compétent et je voudrais vous dire que j'ai de l'expérience.</textarea>
        <button onclick="testGroq()">Tester IA</button>
        <div id="groq-result" class="result"></div>
    </div>

    <script src="database/init-browser-sqlite.js"></script>
    <script src="database-rules-manager.js"></script>
    <script src="database-integration.js"></script>
    <script src="groq-ai-analyzer.js"></script>
    <script src="hybrid-nlp-analyzer.js"></script>
    <script src="hybrid-pipeline-fixed.js"></script>

    <script>
        async function testGroq() {
            const text = document.getElementById('test-text').value;
            const resultDiv = document.getElementById('groq-result');
            
            try {
                console.log('🧠 Test IA avec modèle llama-3.1-8b-instant...');
                const result = await window.groqAIAnalysis(text);
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h4>✅ Succès IA Groq</h4>
                        <p><strong>Modèle:</strong> llama-3.1-8b-instant</p>
                        <p><strong>Suggestions:</strong> ${result ? result.length : 0}</p>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                console.error('❌ Erreur:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>❌ Erreur IA Groq</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Initialiser au chargement
        window.addEventListener('load', async () => {
            console.log('🚀 Initialisation test final...');
            // Attendre que tout soit chargé
            await new Promise(resolve => setTimeout(resolve, 2000));
            console.log('✅ Prêt pour les tests');
        });
    </script>
</body>
</html>
