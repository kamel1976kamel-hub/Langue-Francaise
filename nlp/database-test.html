<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗄️ Test Base de Données NLP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #f8fafc;
        }
        
        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .success {
            background: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .error {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        
        .btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: #6b7280;
        }
        
        .btn.secondary:hover {
            background: #4b5563;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .rule-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .rule-item {
            background: #f8fafc;
            border-left: 4px solid #10b981;
            padding: 15px;
            margin: 10px 0;
            border-radius: 0 6px 6px 0;
        }
        
        .rule-name {
            font-weight: bold;
            color: #1e293b;
        }
        
        .rule-category {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .rule-pattern {
            font-family: monospace;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .rule-explanation {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }
        
        .test-area {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin: 15px 0;
        }
        
        .test-input {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
        }
        
        .correction-item {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            margin: 8px 0;
            border-radius: 0 6px 6px 0;
        }
        
        .correction-text {
            font-weight: 500;
            color: #92400e;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗄️ Test Base de Données NLP</h1>
        <p>Vérification du système après réorganisation</p>
    </div>

    <div class="card">
        <h2>📊 État du Système</h2>
        <div id="system-status">
            <div class="loading">
                <div class="spinner"></div>
                Initialisation du système...
            </div>
        </div>
        
        <div class="stats-grid" id="stats-grid">
            <!-- Statistiques insérées ici -->
        </div>
    </div>

    <div class="card">
        <h2>🧪 Test de Correction</h2>
        
        <div class="test-area">
            <h3>Texte à tester</h3>
            <textarea id="test-input" class="test-input" placeholder="Entrez un texte à tester...">L'enfant mange beaucoup et c'est quoi ce livre ? Les enfant joue dans le jardin. Il vas à l'école.</textarea>
            
            <div style="margin: 15px 0;">
                <button onclick="testCorrection()" class="btn">🔍 Tester la correction</button>
                <button onclick="loadSample()" class="btn secondary">📋 Charger exemple</button>
                <button onclick="clearResults()" class="btn secondary">🗑️ Effacer</button>
            </div>
        </div>
        
        <div id="test-results">
            <div class="loading">
                <p>Cliquez sur "Tester la correction" pour commencer</p>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>📋 Règles Disponibles</h2>
        <div id="rules-container">
            <div class="loading">
                <div class="spinner"></div>
                Chargement des règles...
            </div>
        </div>
    </div>

    <!-- Scripts du système NLP réorganisé -->
    <script src="database/init-browser-sqlite.js"></script>
    <script src="database-rules-manager.js"></script>
    <script src="spacy-analyzer.js"></script>
    <script src="advanced-text-corrector.js"></script>
    <script src="groq-ai-analyzer.js"></script>
    <script src="text-corrector-ui.js"></script>
    <script src="integration-manager.js"></script>

    <script>
        let dbManager = null;
        let systemReady = false;
        
        // Initialisation du système
        async function initializeSystem() {
            try {
                console.log('🚀 Initialisation du système NLP réorganisé...');
                
                // Initialiser la base de données SQLite pour navigateur
                const sqliteManager = new BrowserSQLiteManager();
                await sqliteManager.initialize();
                
                // Configurer le gestionnaire de base de données pour utiliser SQLite
                dbManager = new DatabaseRulesManager({
                    useSQLite: true,
                    sqlitePath: 'browser',
                    cacheRules: true,
                    cacheTimeout: 300000
                });
                
                // Remplacer la méthode query pour utiliser le navigateur
                dbManager.db = sqliteManager;
                dbManager.db.query = sqliteManager.query.bind(sqliteManager);
                dbManager.db.getAllRules = sqliteManager.getAllRules.bind(sqliteManager);
                dbManager.db.getRulesByCategory = sqliteManager.getRulesByCategory.bind(sqliteManager);
                
                await dbManager.initialize();
                
                systemReady = true;
                updateSystemStatus('✅ Système NLP réorganisé prêt', 'success');
                displayStats();
                displayRules();
                
                console.log('✅ Système NLP réorganisé initialisé avec succès');
                
            } catch (error) {
                console.error('❌ Erreur d\'initialisation:', error);
                updateSystemStatus('❌ Erreur d\'initialisation: ' + error.message, 'error');
            }
        }
        
        function updateSystemStatus(message, type) {
            const statusDiv = document.getElementById('system-status');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'loading';
            statusDiv.innerHTML = `<div class="${className}">${message}</div>`;
        }
        
        async function displayStats() {
            if (!dbManager) return;
            
            try {
                const stats = dbManager.getStats();
                const statsGrid = document.getElementById('stats-grid');
                
                let totalRules = 0;
                let html = '';
                
                Object.keys(stats).forEach(category => {
                    totalRules += stats[category].total;
                    html += `
                        <div class="stat-item">
                            <div class="stat-value">${stats[category].total}</div>
                            <div class="stat-label">${category.toUpperCase()}</div>
                        </div>
                    `;
                });
                
                html += `
                    <div class="stat-item">
                        <div class="stat-value">${totalRules}</div>
                        <div class="stat-label">TOTAL</div>
                    </div>
                `;
                
                statsGrid.innerHTML = html;
                
            } catch (error) {
                console.error('Erreur lors de l\'affichage des statistiques:', error);
            }
        }
        
        async function displayRules() {
            if (!dbManager) return;
            
            try {
                const allRules = await dbManager.getAllRules();
                const rulesContainer = document.getElementById('rules-container');
                
                let html = '';
                
                Object.keys(allRules).forEach(category => {
                    if (allRules[category].length > 0) {
                        html += `<h3>${category.toUpperCase()} (${allRules[category].length} règles)</h3>`;
                        html += '<div class="rule-list">';
                        
                        allRules[category].forEach(rule => {
                            html += `
                                <div class="rule-item">
                                    <div>
                                        <span class="rule-name">${rule.name}</span>
                                        <span class="rule-category">${rule.category}</span>
                                    </div>
                                    <div class="rule-pattern">Pattern: ${rule.pattern}</div>
                                    <div class="rule-explanation">${rule.explanation}</div>
                                    ${rule.example ? `<div class="rule-explanation">Exemple: ${rule.example}</div>` : ''}
                                </div>
                            `;
                        });
                        
                        html += '</div>';
                    }
                });
                
                rulesContainer.innerHTML = html;
                
            } catch (error) {
                console.error('Erreur lors de l\'affichage des règles:', error);
            }
        }
        
        async function testCorrection() {
            if (!systemReady) {
                alert('Système pas encore prêt');
                return;
            }
            
            const text = document.getElementById('test-input').value.trim();
            if (!text) {
                alert('Veuillez entrer un texte à tester');
                return;
            }
            
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Analyse en cours...</div>';
            
            try {
                // Utiliser le système de correction
                const result = await window.correctText(text);
                
                let html = '<h3>🔍 Résultats de la correction</h3>';
                
                if (result.success && result.corrections.length > 0) {
                    html += `
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-value">${result.corrections.length}</div>
                                <div class="stat-label">CORRECTIONS</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${result.confidence}%</div>
                                <div class="stat-label">CONFIANCE</div>
                            </div>
                        </div>
                    `;
                    
                    html += '<h4>Corrections détectées:</h4>';
                    
                    result.corrections.forEach((correction, index) => {
                        html += `
                            <div class="correction-item">
                                <div class="correction-text">
                                    "${correction.text}" → "${correction.correction}"
                                </div>
                                ${correction.explanation ? `<div class="rule-explanation">${correction.explanation}</div>` : ''}
                            </div>
                        `;
                    });
                    
                    html += `
                        <h4>Texte corrigé:</h4>
                        <textarea class="test-input" readonly>${result.correctedText}</textarea>
                    `;
                    
                } else {
                    html += '<div class="success">✅ Aucune correction détectée</div>';
                    html += `
                        <h4>Texte original:</h4>
                        <textarea class="test-input" readonly>${text}</textarea>
                    `;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Erreur lors de la correction:', error);
                resultsDiv.innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
            }
        }
        
        function loadSample() {
            const samples = [
                "L'enfant mange beaucoup et c'est quoi ce livre ? Les enfant joue dans le jardin. Il vas à l'école.",
                "Je suis aller au magasin pour acheter du pain. Il y a beaucoup de monde et j'ai vu un ami.",
                "Les voiture sont garer dans le rue. Il faut faire attention quand on traverse.",
                "Elle est très intelligent et elle réussi tout ces examens. Son travail est remarquable."
            ];
            const randomSample = samples[Math.floor(Math.random() * samples.length)];
            document.getElementById('test-input').value = randomSample;
        }
        
        function clearResults() {
            document.getElementById('test-input').value = '';
            document.getElementById('test-results').innerHTML = '<div class="loading"><p>Cliquez sur "Tester la correction" pour commencer</p></div>';
        }
        
        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                initializeSystem();
            }, 1000);
        });
    </script>
</body>
</html>
