<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pipeline Avancé de Correction</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2563eb;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }
        
        .input-text {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
        }
        
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        
        .correction-item {
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #3b82f6;
            background: #f8fafc;
            border-radius: 0 6px 6px 0;
        }
        
        .correction-item.high-priority {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        
        .correction-item.medium-priority {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        
        .correction-item.low-priority {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .text-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        
        .text-box {
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fafafa;
        }
        
        .text-box h4 {
            margin: 0 0 10px 0;
            color: #374151;
            font-size: 14px;
        }
        
        .text-content {
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .confidence-bar {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #10b981 100%);
            transition: width 0.5s ease;
        }
        
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Pipeline Avancé de Correction Linguistique</h1>
        
        <div class="test-section">
            <h3>📝 Texte à analyser</h3>
            <textarea id="inputText" class="input-text" placeholder="Entrez votre texte ici pour tester le pipeline avancé...">L'enfant mange beaucoup et c'est quoi ce livre ? Les enfant joue dans le jardin.</textarea>
            
            <div>
                <button id="analyzeBtn" class="btn">🔍 Analyser avec pipeline complet</button>
                <button id="rulesOnlyBtn" class="btn">📚 Règles uniquement</button>
                <button id="aiOnlyBtn" class="btn">🤖 IA uniquement</button>
                <button id="clearBtn" class="btn">🗑️ Effacer</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Analyse en cours...
            </div>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <!-- Les résultats seront insérés ici -->
        </div>
    </div>

    <!-- Scripts dans le bon ordre -->
    <script src="spacy-rules-vocabulaire-simple.js"></script>
    <script src="spacy-rules-conjugaison-simple.js"></script>
    <script src="spacy-rules-style.js"></script>
    <script src="spacy-rules-orthographe.js"></script>
    <script src="rules-validator.js"></script>
    <script src="groq-ai-analyzer.js"></script>
    <script src="advanced-text-corrector.js"></script>

    <script>
        console.log('🚀 Démarrage du test du pipeline avancé...');
        
        let isInitialized = false;
        
        // Éléments DOM
        const inputText = document.getElementById('inputText');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const rulesOnlyBtn = document.getElementById('rulesOnlyBtn');
        const aiOnlyBtn = document.getElementById('aiOnlyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        // Initialisation du pipeline
        async function initializePipeline() {
            try {
                loading.classList.add('active');
                loading.innerHTML = '<div class="spinner"></div>Initialisation du pipeline...';
                
                const success = await window.initializeAdvancedPipeline();
                
                if (success) {
                    isInitialized = true;
                    console.log('✅ Pipeline initialisé avec succès');
                    loading.classList.remove('active');
                } else {
                    throw new Error('Échec de l\'initialisation');
                }
                
            } catch (error) {
                console.error('❌ Erreur d\'initialisation:', error);
                loading.innerHTML = `<div class="error">❌ Erreur d'initialisation: ${error.message}</div>`;
                analyzeBtn.disabled = true;
                rulesOnlyBtn.disabled = true;
                aiOnlyBtn.disabled = true;
            }
        }
        
        // Afficher les résultats
        function displayResults(analysisResult) {
            if (!analysisResult) {
                results.innerHTML = '<div class="error">❌ Aucun résultat à afficher</div>';
                return;
            }
            
            let html = '';
            
            // Statistiques
            html += `
                <div class="stats">
                    <div class="stat-card">
                        <span class="stat-value">${analysisResult.corrections?.length || 0}</span>
                        <span class="stat-label">Corrections</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">${analysisResult.confidence || 0}%</span>
                        <span class="stat-label">Confiance</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">${analysisResult.stats?.rule_matches || 0}</span>
                        <span class="stat-label">Règles</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">${analysisResult.stats?.ai_suggestions || 0}</span>
                        <span class="stat-label">IA</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value">${analysisResult.analysis_time || 0}ms</span>
                        <span class="stat-label">Temps</span>
                    </div>
                </div>
            `;
            
            // Barre de confiance
            html += `
                <h4>🎯 Niveau de confiance</h4>
                <div class="confidence-bar">
                    <div class="confidence-fill" style="width: ${analysisResult.confidence || 0}%"></div>
                </div>
            `;
            
            // Comparaison texte
            if (analysisResult.corrected_text !== analysisResult.original_text) {
                html += `
                    <div class="text-comparison">
                        <div class="text-box">
                            <h4>📝 Texte original</h4>
                            <div class="text-content">${analysisResult.original_text}</div>
                        </div>
                        <div class="text-box">
                            <h4>✅ Texte corrigé</h4>
                            <div class="text-content">${analysisResult.corrected_text}</div>
                        </div>
                    </div>
                `;
            }
            
            // Corrections détaillées
            if (analysisResult.corrections && analysisResult.corrections.length > 0) {
                html += '<h4>🔍 Corrections détaillées</h4>';
                
                analysisResult.corrections.forEach((correction, index) => {
                    const priorityClass = correction.priority >= 80 ? 'high-priority' : 
                                         correction.priority >= 50 ? 'medium-priority' : 'low-priority';
                    
                    html += `
                        <div class="correction-item ${priorityClass}">
                            <strong>[${correction.rule_id}] ${correction.category}</strong> - Priorité: ${correction.priority}
                            <br><em>${correction.message}</em>
                            ${correction.matched_text ? `<br><code>"${correction.matched_text}"</code> → <code>"${correction.suggestion}"</code>` : ''}
                            ${correction.explanation ? `<br><small>💡 ${correction.explanation}</small>` : ''}
                            ${correction.example ? `<br><small>📝 Exemple: ${correction.example}</small>` : ''}
                        </div>
                    `;
                });
            } else {
                html += '<p>✅ Aucune correction détectée. Le texte semble correct !</p>';
            }
            
            // Métadonnées
            if (analysisResult.metadata) {
                html += `
                    <h4>📊 Métadonnées</h4>
                    <ul>
                        <li>Longueur du texte: ${analysisResult.metadata.text_length} caractères</li>
                        <li>Densité de corrections: ${analysisResult.metadata.correction_density}</li>
                        <li>Catégories: ${analysisResult.metadata.categories.join(', ')}</li>
                    </ul>
                `;
            }
            
            // Erreur éventuelle
            if (analysisResult.error) {
                html += `<div class="error">❌ Erreur: ${analysisResult.error}</div>`;
            }
            
            results.innerHTML = html;
            results.style.display = 'block';
        }
        
        // Analyser avec options
        async function analyzeWithOptions(options) {
            if (!isInitialized) {
                await initializePipeline();
            }
            
            const text = inputText.value.trim();
            if (!text) {
                alert('Veuillez entrer un texte à analyser');
                return;
            }
            
            loading.classList.add('active');
            loading.innerHTML = '<div class="spinner"></div>Analyse en cours...';
            results.style.display = 'none';
            
            try {
                const result = await window.advancedTextAnalysis(text, options);
                displayResults(result);
            } catch (error) {
                console.error('❌ Erreur lors de l\'analyse:', error);
                results.innerHTML = `<div class="error">❌ Erreur lors de l'analyse: ${error.message}</div>`;
                results.style.display = 'block';
            } finally {
                loading.classList.remove('active');
            }
        }
        
        // Event listeners
        analyzeBtn.addEventListener('click', () => analyzeWithOptions({}));
        rulesOnlyBtn.addEventListener('click', () => analyzeWithOptions({ enableAI: false }));
        aiOnlyBtn.addEventListener('click', () => analyzeWithOptions({ enableRules: false }));
        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            results.style.display = 'none';
            loading.classList.remove('active');
        });
        
        // Tests automatiques
        const testTexts = [
            "L'enfant mange beaucoup et c'est quoi ce livre ?",
            "Les enfant joue dans le jardin.",
            "Je vais à la école pour apprendre le français.",
            "Il ont fait des erreur dans leur devoir."
        ];
        
        let currentTestIndex = 0;
        
        function runNextTest() {
            if (currentTestIndex < testTexts.length) {
                inputText.value = testTexts[currentTestIndex];
                analyzeWithOptions({});
                currentTestIndex++;
            }
        }
        
        // Initialisation au chargement
        document.addEventListener('DOMContentLoaded', () => {
            initializePipeline();
        });
        
        console.log('✅ Interface de test prête');
    </script>
</body>
</html>
